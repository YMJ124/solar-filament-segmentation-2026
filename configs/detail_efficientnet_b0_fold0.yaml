schema_version: 1

run:
  name: detail_efficientnet_b0_fold0
  seed: 2026
  deterministic: true

data:
  data_root: MAGFiLO_1.0_Kaggle_2026
  fold_manifest: data/manifests/train_folds.csv
  mask_cache_dir: data/cache/medoid_v1
  fold: 0
  image_size: 256
  positive_crop_probability: 0.7
  num_workers: 2

model:
  kind: detail
  architecture: efficientnet_b0_unet
  encoder_weights: imagenet
  # Exact statistics from the 569 physical training images outside fold 0.
  input_mean: 0.326732
  input_std: 0.223022

training:
  epochs: 40
  batch_size: 4
  gradient_accumulation: 2
  learning_rate: 0.0002
  weight_decay: 0.0001
  warmup_epochs: 3
  amp: true
  gradient_clip_norm: 1.0
  max_steps: null
  max_validation_batches: null
  teacher_checkpoint: artifacts/runs/global_resnet34_fold0/checkpoints/best.pt
  teacher_probability_augmentation:
    dropout: 0.03
    blur_probability: 0.20
    blur_kernel: 3

validation:
  full_pq_enabled: true
  full_pq_interval: 5
  tile_size: 256
  tile_batch_size: 8
  overlap: 0.25
  # Frozen Stage-1 OOF post-processing values.
  threshold: 0.325
  min_area: 160
  closing_iterations: 1
  boundary_threshold: 0.5
  marker_threshold: 0.15
  marker_min_distance: 8
  max_instances: 128
  max_images: null
  save_best_oof: true
  save_components: true

artifacts:
  run_dir: artifacts/runs/detail_efficientnet_b0_fold0
